[project]
name = "dp2m-tools"
version = "0"
description = "DP2M firmware reverse-engineering tools and emulated build verifier"
requires-python = ">=3.11"
dependencies = ["capstone>=5", "unicorn>=2.1", "numpy", "scipy", "pillow"]

# dependencies only: run `python -m tools.re` / `python -m tools.verify` from the repo root
[tool.setuptools]
py-modules = []
