name: ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.1"
          components: clippy
          target: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y clang lld
      - run: cargo clippy --release --workspace --all-targets -- -D warnings
      - run: cargo build --release -p dp2m-web --target wasm32-unknown-unknown
      - run: cargo run --release -p dp2m -- build --out out
      - run: cargo test --release --workspace
      - run: cargo run --release -p dp2m -- verify out
      - run: cargo run --release -p dp2m -- verify-m5 out/Firm.bin
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            out/DP2MV*.bin
            out/Firm.bin
            out/C78FRM.bin
